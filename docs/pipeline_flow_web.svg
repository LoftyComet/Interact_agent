<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="900" height="1100" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Gesture Agent Web 端 请求→响应 流程</text>

  <!-- ============================================================ -->
  <!-- 三大区域 -->
  <!-- ============================================================ -->

  <!-- 区域1: 浏览器 -->
  <rect x="30" y="70" width="840" height="230" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="70" width="840" height="32" rx="10" fill="#2563eb"/>
  <rect x="30" y="90" width="840" height="12" fill="#2563eb"/>
  <text x="50" y="92" font-size="14" font-weight="bold" fill="#fff">🌐 浏览器 (前端)</text>

  <!-- 输入 -->
  <rect x="55" y="115" width="240" height="80" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="175" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">👤 用户输入</text>
  <text x="175" y="158" text-anchor="middle" font-size="11" fill="#475569">输入问题文本</text>
  <text x="175" y="176" text-anchor="middle" font-size="11" fill="#475569">可选：上传图片 · 选模型 · 选风格</text>

  <!-- 会话 -->
  <rect x="330" y="115" width="240" height="80" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="450" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">🔑 会话管理</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#475569">sessionStorage 存 session_id</text>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#475569">新标签页 = 新会话，刷新 = 清空记忆</text>

  <!-- 请求 -->
  <rect x="605" y="115" width="240" height="80" rx="8" fill="#fff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="725" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">📤 发送请求</text>
  <text x="725" y="158" text-anchor="middle" font-size="11" fill="#475569">POST /api/ask_stream (流式)</text>
  <text x="725" y="176" text-anchor="middle" font-size="11" fill="#475569">POST /api/ask (非流式)</text>

  <line x1="295" y1="155" x2="328" y2="155" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="155" x2="603" y2="155" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 渲染结果 -->
  <rect x="55" y="210" width="790" height="78" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="450" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">📋 响应渲染</text>
  <text x="450" y="256" text-anchor="middle" font-size="11" fill="#475569">Markdown → HTML (marked.js) · 引用编号 [n] 可点击查看原文 · 图片可放大 · 追问选项可点选</text>
  <text x="450" y="275" text-anchor="middle" font-size="11" fill="#475569">流式：逐字打印 + 打字动画 · 非流式：等待完整结果一次性展示</text>

  <!-- 箭头 前端→后端 -->
  <line x1="450" y1="300" x2="450" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="460" y="325" font-size="11" fill="#64748b">HTTP 请求</text>

  <!-- 区域2: Flask 后端 -->
  <rect x="30" y="345" width="840" height="380" rx="10" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="345" width="840" height="32" rx="10" fill="#be185d"/>
  <rect x="30" y="365" width="840" height="12" fill="#be185d"/>
  <text x="50" y="367" font-size="14" font-weight="bold" fill="#fff">⚙️ Flask 后端 (核心管线)</text>

  <!-- 步骤1 -->
  <rect x="55" y="390" width="185" height="72" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="147" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">① 理解意图</text>
  <text x="147" y="430" text-anchor="middle" font-size="10" fill="#64748b">正则匹配 18 种意图</text>
  <text x="147" y="446" text-anchor="middle" font-size="10" fill="#64748b">+ 标注样例 + LLM兜底</text>
  <text x="147" y="460" text-anchor="middle" font-size="9" fill="#9ca3af">提取：术语、层级、焦点</text>

  <!-- 步骤2 -->
  <rect x="270" y="390" width="185" height="72" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="362" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">② 判断话题关系</text>
  <text x="362" y="430" text-anchor="middle" font-size="10" fill="#64748b">追问？新话题？回答澄清？</text>
  <text x="362" y="446" text-anchor="middle" font-size="10" fill="#64748b">指代词 / 术语重合 / LLM</text>
  <text x="362" y="460" text-anchor="middle" font-size="9" fill="#9ca3af">追问 → 注入历史记忆</text>

  <!-- 步骤3 -->
  <rect x="485" y="390" width="185" height="72" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="577" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">③ 检索知识</text>
  <text x="577" y="430" text-anchor="middle" font-size="10" fill="#64748b">BM25 关键词检索</text>
  <text x="577" y="446" text-anchor="middle" font-size="10" fill="#64748b">术语加权 + 结构化重排</text>
  <text x="577" y="460" text-anchor="middle" font-size="9" fill="#9ca3af">返回 top_K 条资料片段</text>

  <!-- 步骤4 -->
  <rect x="700" y="390" width="145" height="72" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="772" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">④ 组装提示词</text>
  <text x="772" y="430" text-anchor="middle" font-size="10" fill="#64748b">System Prompt</text>
  <text x="772" y="446" text-anchor="middle" font-size="10" fill="#64748b">+ 资料 + 术语</text>
  <text x="772" y="460" text-anchor="middle" font-size="9" fill="#9ca3af">+ 输出框架骨架</text>

  <line x1="240" y1="426" x2="268" y2="426" stroke="#f9a8d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="426" x2="483" y2="426" stroke="#f9a8d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="426" x2="698" y2="426" stroke="#f9a8d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑤+⑥ -->
  <rect x="55" y="478" width="380" height="100" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="245" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">⑤ 调用 LLM API</text>
  <text x="245" y="520" text-anchor="middle" font-size="10" fill="#64748b">流式: SSE Generator → 逐 token 推送 delta 事件</text>
  <text x="245" y="538" text-anchor="middle" font-size="10" fill="#64748b">非流式: 等待完整回答 → JSON 一次性返回</text>
  <text x="245" y="556" text-anchor="middle" font-size="10" fill="#64748b">支持: SiliconFlow / DeepSeek / Kimi / Anthropic</text>
  <text x="245" y="572" text-anchor="middle" font-size="9" fill="#9ca3af">有图片时自动切换视觉模型</text>

  <rect x="465" y="478" width="380" height="100" rx="8" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="655" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">⑥ 后处理</text>
  <text x="655" y="520" text-anchor="middle" font-size="10" fill="#64748b">输出验证：术语准确 · 结构完整 · 框架遵循</text>
  <text x="655" y="538" text-anchor="middle" font-size="10" fill="#64748b">发现问题 → 拼修正提示词 → 重试(最多N次)</text>
  <text x="655" y="556" text-anchor="middle" font-size="10" fill="#64748b">记录本轮对话到会话历史 (最近6轮)</text>
  <text x="655" y="572" text-anchor="middle" font-size="9" fill="#9ca3af">图片引用 image:ID → 替换为真实图片 URL</text>

  <!-- 澄清分支 -->
  <rect x="55" y="596" width="790" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="450" y="618" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">⚠️ 意图不清晰时：不进入检索和LLM，直接回传追问选项</text>
  <text x="450" y="638" text-anchor="middle" font-size="10" fill="#64748b">前端渲染为可点击按钮，用户点选后作为下一轮输入自动发送</text>

  <!-- 箭头 后端→LLM -->
  <line x1="800" y1="725" x2="800" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="812" y="752" font-size="11" fill="#64748b">API</text>

  <!-- 区域3: LLM -->
  <rect x="220" y="775" width="460" height="55" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="800" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">🧠 LLM (SiliconFlow / DeepSeek / Kimi)</text>
  <text x="450" y="820" text-anchor="middle" font-size="11" fill="#64748b">OpenAI 兼容 API · 流式 chunk → 流式 delta</text>

  <!-- 箭头 LLM→后端→前端 -->
  <line x1="450" y1="830" x2="450" y2="930" stroke="#475569" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- SSE 流式说明 -->
  <rect x="55" y="865" width="790" height="58" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="450" y="888" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">📡 SSE 流式事件序列 (默认模式)</text>
  <rect x="75" y="898" width="100" height="20" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/><text x="125" y="913" text-anchor="middle" font-size="10" fill="#15803d">meta</text>
  <text x="185" y="913" font-size="10" fill="#64748b">→</text>
  <rect x="200" y="898" width="100" height="20" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/><text x="250" y="913" text-anchor="middle" font-size="10" fill="#15803d">delta×N</text>
  <text x="310" y="913" font-size="10" fill="#64748b">→</text>
  <rect x="325" y="898" width="100" height="20" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/><text x="375" y="913" text-anchor="middle" font-size="10" fill="#15803d">done</text>
  <text x="435" y="913" font-size="10" fill="#64748b">（异常时：error / retry → replace）</text>

  <!-- ============================================================ -->
  <!-- 底部总结 -->
  <!-- ============================================================ -->
  <rect x="30" y="945" width="840" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="55" y="975" font-size="14" font-weight="bold" fill="#334155">💡 核心设计思路</text>

  <circle cx="75" cy="1000" r="4" fill="#2563eb"/>
  <text x="90" y="1005" font-size="12" fill="#334155"><tspan font-weight="bold">意图驱动：</tspan>不是把问题直接丢给 LLM，而是先解析意图 → 按意图检索对应知识 → 按意图套用输出框架 → 再让 LLM 按照框架作答</text>

  <circle cx="75" cy="1025" r="4" fill="#2563eb"/>
  <text x="90" y="1030" font-size="12" fill="#334155"><tspan font-weight="bold">会话感知：</tspan>追问时自动注入历史记忆，澄清时引导用户补充信息，多轮对话保持上下文连贯</text>

  <circle cx="75" cy="1050" r="4" fill="#2563eb"/>
  <text x="90" y="1055" font-size="12" fill="#334155"><tspan font-weight="bold">验证闭环：</tspan>输入侧校验术语准确性，输出侧校验内容质量，发现问题自动修正重试</text>

  <circle cx="460" cy="1000" r="4" fill="#be185d"/>
  <text x="475" y="1005" font-size="12" fill="#334155"><tspan font-weight="bold">前后分离：</tspan>Flask 纯 API 后端 + Vanilla JS 前端，SSE 流式优先，非流式兜底</text>

  <circle cx="460" cy="1025" r="4" fill="#be185d"/>
  <text x="475" y="1030" font-size="12" fill="#334155"><tspan font-weight="bold">多 Provider：</tspan>统一的 build_chat_client 接口，前端下拉切换，后端自动路由</text>

  <circle cx="460" cy="1050" r="4" fill="#be185d"/>
  <text x="475" y="1055" font-size="12" fill="#334155"><tspan font-weight="bold">知识锚定：</tspan>LLM 只能依据检索到的词典资料回答，不足时坦诚说明，不编造</text>

  <!-- 底部标注 -->
  <text x="450" y="1090" text-anchor="middle" font-size="10" fill="#94a3b8">Flask + Vanilla JS · SSE 流式 · 多 Provider 切换 · 多轮会话记忆</text>
</svg>
