[project]
name = "gesture-dictionary-agent"
version = "0.1.0"
description = "A structured learning agent prototype for an interaction design gesture dictionary."
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-docx>=1.1.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["gesture_agent*", "paper_agent*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
