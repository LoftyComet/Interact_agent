<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesture Agent · 交互手势词典</title>
    <link rel="stylesheet" href="./styles.css?v=20260610" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span class="title">Gesture Agent</span>
        <span class="subtitle">交互手势词典 · 学习与设计评估</span>
      </div>
      <div class="topbar-actions">
        <div class="mode-switch" id="mode-switch">
          <button type="button" class="mode-btn active" data-mode="dict">词典问答</button>
          <button type="button" class="mode-btn" data-mode="papers">论文检索</button>
        </div>
        <span id="health" class="health">connecting…</span>
        <button id="reset" class="btn ghost" title="清空当前会话记忆">清空会话</button>
      </div>
    </header>

    <main class="layout">
      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>

        <form id="composer" class="composer" autocomplete="off">
          <div class="composer-row">
            <textarea
              id="question"
              rows="2"
              placeholder="问点什么 — 比如：拖拽和滑动有什么区别？"
              required
            ></textarea>
            <div class="composer-side">
              <label class="select-field">
                <span>模型</span>
                <select id="provider"></select>
              </label>
              <label class="select-field">
                <span>风格</span>
                <select id="style">
                  <option value="concise" selected>简洁</option>
                  <option value="detailed">详细</option>
                </select>
              </label>
              <label class="checkbox">
                <input type="checkbox" id="stream" checked />
                <span>流式输出</span>
              </label>
              <button type="submit" id="send" class="btn primary">发送</button>
            </div>
          </div>
          <div class="composer-row advanced-toggle">
            <button type="button" id="advanced-toggle" class="advanced-chip" title="高级选项">
              <svg class="chip-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              <span class="chip-label">高级选项</span>
              <svg class="chip-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <span id="intent-badge" class="intent-badge" hidden></span>
          </div>
          <div class="composer-row advanced-panel collapsed" id="advanced-panel">
            <div class="advanced-panel-inner">
              <div class="advanced-field intent-selector">
                <div class="advanced-field-head">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
                    <line x1="12" y1="22" x2="12" y2="15.5"/>
                    <polyline points="22 8.5 12 15.5 2 8.5"/>
                  </svg>
                  <span>意图</span>
                </div>
                <select id="intent">
                  <option value="" selected>自动检测</option>
                </select>
              </div>
              <div class="advanced-divider"></div>
              <div class="advanced-field bg-selector">
                <div class="advanced-field-head">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                  </svg>
                  <span>自定义背景知识</span>
                </div>
                <textarea
                  id="background"
                  rows="2"
                  placeholder="可选：补充场景、约束或上下文信息，会随词典资料一起提供给模型参考..."
                ></textarea>
              </div>
            </div>
          </div>
          <div class="composer-row optional">
            <input
              type="file"
              id="image-files"
              accept="image/*"
              multiple
              hidden
            />
            <label for="image-files" class="btn ghost upload-btn">＋ 添加图片</label>
            <span class="upload-hint">可选，支持多张；单张上限 10MB</span>
            <div id="image-preview" class="image-preview"></div>
          </div>
        </form>
      </section>

      <aside class="inspector">
        <div class="panel" id="panel-structure">
          <h3>问题结构</h3>
          <pre id="structure" class="codeblock">—</pre>
        </div>
        <div class="panel" id="panel-papers" hidden>
          <h3>论文库</h3>
          <div id="papers-status" class="papers-status">加载中…</div>
          <div class="papers-admin" id="papers-admin" hidden>
            <div class="papers-admin-head">
              <span class="papers-admin-title">管理员操作</span>
              <label class="select-field">
                <span>管理员令牌</span>
                <input type="password" id="papers-token" placeholder="输入令牌以解锁" autocomplete="off" />
              </label>
            </div>
            <label class="select-field">
              <span>会议</span>
              <input type="text" id="papers-venues" value="CHI,UIST,DIS,MobileHCI,IUI" />
            </label>
            <div class="papers-years">
              <label class="select-field">
                <span>起始年</span>
                <input type="number" id="papers-from" value="2016" min="2000" max="2030" />
              </label>
              <label class="select-field">
                <span>结束年</span>
                <input type="number" id="papers-to" value="2025" min="2000" max="2030" />
              </label>
            </div>
            <div class="papers-actions">
              <button type="button" id="papers-fetch" class="btn ghost">抓取语料</button>
              <button type="button" id="papers-build" class="btn ghost">构建索引</button>
            </div>
            <pre id="papers-log" class="codeblock papers-log" hidden></pre>
          </div>
        </div>
      </aside>
    </main>

    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/purify.min.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
